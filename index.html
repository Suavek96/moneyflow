/* Apple-inspired UI refresh v1.8.1 */
:root{
  --ios-bg:#f5f5f7;
  --ios-surface:rgba(255,255,255,.78);
  --ios-card:#ffffff;
  --ios-border:rgba(15,23,42,.08);
  --ios-ink:#1d1d1f;
  --ios-muted:#6e6e73;
  --ios-blue:var(--mf-accent);
  --ios-blue-soft:#eaf4ff;
  --ios-green:#18a957;
  --ios-red:#ff3b30;
  --ios-shadow:0 10px 30px rgba(15,23,42,.06),0 2px 8px rgba(15,23,42,.04);
}
html{background:var(--ios-bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
  background:radial-gradient(circle at top left,#f7fbff 0,#f5f5f7 40%,#f3f4f7 100%);
  color:var(--ios-ink);
  letter-spacing:-.01em;
}
button,input,select,textarea{font-family:inherit}
button{
  border-radius:16px;
  font-weight:700;
  padding:12px 16px;
  transition:transform .18s ease, box-shadow .18s ease, filter .18s ease, background .18s ease;
}
button:hover{transform:translateY(-1px)}
button:active{transform:scale(.985)}
button.primary{background:var(--ios-blue);color:#fff;box-shadow:0 8px 18px rgba(10,132,255,.22)}
button.danger{background:var(--ios-red)!important;color:#fff;box-shadow:0 8px 18px rgba(255,59,48,.20)}
button.income-action{background:var(--ios-green)!important;color:#fff;box-shadow:0 8px 18px rgba(24,169,87,.22)}
input,select,textarea{
  border-radius:14px;
  border:1px solid rgba(60,60,67,.14);
  background:#fff;
  min-height:46px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75);
}
input:focus,select:focus,textarea:focus{outline:0;box-shadow:0 0 0 4px rgba(10,132,255,.16)}
aside{
  width:286px;
  padding:20px 16px max(20px,env(safe-area-inset-bottom));
  background:rgba(255,255,255,.74);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border-right:1px solid rgba(60,60,67,.08);
  box-shadow:0 12px 40px rgba(15,23,42,.04);
}
main{margin-left:286px;padding:24px clamp(18px,3vw,42px) 34px;max-width:none}
.brand{gap:12px;padding:4px 6px 10px}
.brand h1{font-size:28px;line-height:1.05;letter-spacing:-.04em;color:var(--ios-ink)}
.brand small{color:var(--ios-muted);font-size:12px}
.brand-mark{
  width:52px;height:52px;border-radius:16px;
  background:linear-gradient(180deg,#8dd5ff 0%,var(--mf-accent) 100%);
  color:#fff;box-shadow:0 10px 22px rgba(10,132,255,.28);
}
nav{margin-top:20px;gap:8px}
nav button{
  border-radius:18px;padding:13px 14px;background:transparent;color:#4d5968;font-weight:600;
}
nav button.active{
  background:linear-gradient(180deg,#3ea0ff 0%,var(--mf-accent) 100%);
  color:#fff;box-shadow:0 12px 24px rgba(10,132,255,.20);
}
nav button.active .ui-icon{opacity:1}
.ui-icon{opacity:.9}
.local-status{
  margin-top:auto;padding:18px 10px 4px;color:#6e6e73;font-size:11.5px;
}
.local-status span{background:var(--ios-blue);box-shadow:0 0 0 4px rgba(10,132,255,.12)}
header{
  position:sticky;top:0;z-index:4;
  margin:-4px 0 22px;padding:12px 0 18px;
  background:linear-gradient(to bottom,rgba(245,245,247,.92) 0%,rgba(245,245,247,.85) 82%,rgba(245,245,247,0) 100%);
  backdrop-filter:blur(14px);
  border-bottom:0;
}
header h2{font-size:34px;line-height:1.05;letter-spacing:-.045em;color:var(--ios-ink)}
header small{font-size:11px;letter-spacing:.12em;color:#8e8e93}
.card{
  background:rgba(255,255,255,.9);
  border:1px solid var(--ios-border);
  border-radius:28px;
  box-shadow:var(--ios-shadow);
  padding:22px;
}
.cards{gap:16px}
.cards .card{min-height:138px}
.cards .card:after{border-color:rgba(255,255,255,.65)}
.metric{font-size:clamp(25px,3vw,40px);font-weight:800;color:var(--ios-ink);letter-spacing:-.05em}
.balance{background:linear-gradient(135deg,#eaf6ff 0%,#d6ecff 100%)}
.income{background:linear-gradient(135deg,#edf9f2 0%,#dff5e6 100%)}
.expense{background:linear-gradient(135deg,#fff0f0 0%,#ffe4e4 100%)}
.balance .metric{color:var(--mf-link)}.green{color:var(--ios-green)}.red{color:var(--ios-red)}.transfer-value{color:var(--mf-link)}
h3{font-size:20px;letter-spacing:-.03em;color:var(--ios-ink)}
small,.muted{color:var(--ios-muted)}
.line{border-bottom:1px solid rgba(60,60,67,.08);padding:14px 0;border-radius:14px}
.line:hover{background:rgba(10,132,255,.04)}
.tag,.pill{background:#eef5ff;color:var(--mf-link);border-radius:999px;padding:5px 10px;font-weight:600}
.bar{height:12px;background:#edf0f4;border-radius:999px}.bar span{background:linear-gradient(90deg,#6cc8ff 0%,var(--mf-accent) 100%)}
.day{background:rgba(255,255,255,.84);border:1px solid rgba(60,60,67,.08);border-radius:18px;min-height:84px}.day.today{outline:0;box-shadow:inset 0 0 0 2px rgba(10,132,255,.65)}
dialog{border-radius:30px;background:rgba(255,255,255,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 28px 80px rgba(15,23,42,.22)}
#lock{background:radial-gradient(circle at top,#f5fbff 0,#f5f5f7 65%)}
#lock .card{background:rgba(255,255,255,.94)}
.notice{background:#fff7e7;border:1px solid rgba(252,177,0,.18);border-radius:18px}
.plan-tabs{background:#eef1f5;border-radius:16px;padding:4px}
.plan-tabs button{border-radius:13px;min-height:44px;box-shadow:none}
.plan-tabs button.in.selected{background:var(--ios-green)!important;color:#fff}
.plan-tabs button.out.selected{background:var(--ios-red)!important;color:#fff}
.plan-tabs button.in:not(.selected){color:var(--ios-green);border:1px solid rgba(24,169,87,.35);background:rgba(24,169,87,.05)}
.plan-tabs button.out:not(.selected){color:var(--ios-red);border:1px solid rgba(255,59,48,.28);background:rgba(255,59,48,.05)}
.picker-current,.picker-tile,.picker-recent button,.repeat-grid button{border-radius:16px}
.picker-current{background:#f4f8fc;border:1px solid rgba(60,60,67,.1)}
.repeat-grid button.selected,.picker-tile.selected{background:var(--ios-blue);border-color:var(--ios-blue);color:#fff;box-shadow:0 10px 18px rgba(10,132,255,.16)}
.filter-grid label,.stat-controls label{gap:7px}
::-webkit-scrollbar{height:10px;width:10px}::-webkit-scrollbar-thumb{background:rgba(60,60,67,.22);border-radius:999px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
@media(max-width:760px){
  body{padding-bottom:env(safe-area-inset-bottom)}
  aside{position:static;width:auto;padding:14px 14px 12px;background:rgba(255,255,255,.82);border-right:0;border-bottom:1px solid rgba(60,60,67,.08)}
  .brand{padding:2px 2px 10px}.brand-mark{width:44px;height:44px;font-size:24px}.brand h1{font-size:24px}
  nav{display:flex;gap:8px;overflow:auto;padding-bottom:4px}
  nav button{background:rgba(255,255,255,.78);border:1px solid rgba(60,60,67,.08);border-radius:16px;padding:11px 13px}
  nav button.active{background:linear-gradient(180deg,#3ea0ff 0%,var(--mf-accent) 100%)}
  main{margin:0;padding:16px 14px 26px}
  header{padding:8px 0 14px}header h2{font-size:30px}
  .cards{grid-template-columns:1fr 1fr}.cards .balance{grid-column:span 2}
  .card{border-radius:24px;padding:18px}
}
@media(min-width:761px){
  .actions{gap:10px}
  .actions button{min-height:46px;padding-inline:16px}
}

function accounts(){let active=activeAccounts(),archived=data.accounts.filter(a=>a.archived),credit=data.accounts.filter(a=>accountKind(a)==='credit'),net=data.accounts.reduce((s,a)=>s+cents(balance(a)),0)/100,debt=credit.reduce((s,a)=>s+Math.max(0,-cents(balance(a))),0)/100;let card=a=>{let kind=accountKind(a),b=balance(a),used=Math.max(0,-b),limit=Number(a.limit||0);return `<article class="account-tile card"><div class="account-head">${accountBadge(a)}<div><h3>${esc(a.name)}</h3><small>${esc(accountTypes().find(t=>t.id===kind).name)}${a.archived?' · Archiviato':''}</small></div></div><small>${kind==='credit'?'Saldo della carta':'Saldo attuale'}</small><div class="metric ${b<0?'red':''}">${eur(b)}</div>${kind==='credit'?`<div class="account-info"><div class="line"><span>Debito corrente</span><b class="red">${eur(used)}</b></div>${limit?`<div class="line"><span>Credito residuo</span><b>${eur(limit-used)}</b></div><div class="bar"><span style="width:${Math.min(100,used/limit*100)}%"></span></div>`:''}${a.statementDay?`<small>Chiusura: giorno ${Number(a.statementDay)} · Addebito: giorno ${Number(a.paymentDay)}</small>`:''}</div>`:''}<div class="actions account-actions">${btn('Modifica',`editAccount('${a.id}')`)}${!a.archived?btn('Riconcilia',`reconcileAccount('${a.id}')`):''}${kind==='credit'&&used>0&&!a.archived?btn('Rimborsa',`repayCard('${a.id}')`,'primary'):''}${btn(a.archived?'Riattiva':'Archivia',`archiveAccount('${a.id}')`)}${btn('Elimina',`remove('accounts','${a.id}')`,'quiet-danger')}</div></article>`};return `<section class="card"><div class="section-heading"><h3>I tuoi conti</h3>${btn('+ Nuovo conto','editAccount()','primary')}</div><div class="account-overview"><div><small>Patrimonio netto dei conti</small><div class="metric">${eur(net)}</div></div><div><small>Debito carte di credito</small><div class="metric red">${eur(debt)}</div></div></div><small>Il debito delle carte è già incluso nel patrimonio netto. I conti archiviati restano inclusi nei saldi e nello storico.</small></section><div class="account-grid">${active.map(card).join('')||empty('Nessun conto attivo.')}</div>${archived.length?`<details class="card"><summary>Conti archiviati · ${archived.length}</summary><div class="account-grid">${archived.map(card).join('')}</div></details>`:''}${installmentPanel()}`}
function editAccount(id){let a=data.accounts.find(x=>x.id===id)||{},kind=accountKind(a);openForm(id?'Modifica conto':'Nuovo conto',field('name','Nome','text',a.name)+select('kind','Tipo di conto',opts(accountTypes(),kind))+field('initial','Saldo iniziale (€)','number',a.initial??0,'step="0.01"')+`<small>Per una carta di credito, inserisci un saldo negativo se hai già un debito. Per correggere il saldo attuale usa Riconcilia.</small><div class="two"><label>Colore<input type="color" name="color" value="${validHex(a.color)?a.color:'#3988bd'}"></label>${select('glyph','Icona',opts([{id:'auto',name:'Automatica'},{id:'wallet',name:'Portafoglio'},{id:'cash',name:'Banconota'},{id:'credit',name:'Carta'},{id:'home',name:'Casa'},{id:'gift',name:'Regalo'},{id:'box',name:'Scatola'},{id:'chart',name:'Grafico'},{id:'briefcase',name:'Lavoro'}],a.glyph||'auto'))}</div><div id="credit-fields">${money('limit',a.limit??'').replace('Importo (€)','Limite di credito (€)').replace(' required','')}${field('statementDay','Giorno di chiusura (1–31)','number',a.statementDay||1,'min="1" max="31" step="1"')}${field('paymentDay','Giorno di addebito (1–31)','number',a.paymentDay||15,'min="1" max="31" step="1"')}<small>Date indicative, senza addebiti automatici. Registra il rimborso effettivo con un trasferimento.</small></div>`,v=>{if(data.accounts.some(x=>x.id!==id&&norm(x.name)===norm(v.name)))return alert('Nome conto già utilizzato.'),false;let credit=v.kind==='credit';put('accounts',{name:v.name,kind:v.kind,initial:Number(v.initial),color:v.color,glyph:v.glyph,limit:credit?Number(v.limit||0):0,statementDay:credit?Number(v.statementDay):0,paymentDay:credit?Number(v.paymentDay):0},id)});let f=$('editor'),update=()=>{let credit=f.elements.kind.value==='credit';$('credit-fields').hidden=!credit;for(let el of $('credit-fields').querySelectorAll('input'))el.disabled=!credit};f.elements.kind.addEventListener('change',update);update()}
function archiveAccount(id){let a=data.accounts.find(x=>x.id===id);if(!a)return;if(!a.archived&&(data.recurring.some(x=>x.account===id)||favoriteList().some(x=>x.account===id)||installmentList().some(x=>x.account===id&&installmentEntries(x).some(r=>!r.paid))))return alert('Prima sposta o rimuovi le pianificazioni, i preferiti e le rate non pagate collegati a questo conto.');let old=a.archived;a.archived=!a.archived;if(!save()){a.archived=old;return}render();notify(a.archived?'Conto archiviato':'Conto riattivato')}
function reconcileAccount(id){let a=data.accounts.find(x=>x.id===id);if(!a||a.archived)return;openForm('Riconcilia saldo',`<p>Conto: <b>${esc(a.name)}</b><br>Saldo registrato: <b>${eur(balance(a))}</b></p>`+field('initial','Saldo effettivo di oggi (€)','number',balance(a).toFixed(2),'step="0.01"')+field('title','Motivo della differenza','text','Riconciliazione saldo')+`<small>Verrà registrata una rettifica separata, senza alterare il saldo iniziale o le statistiche di entrate e uscite.</small>`,v=>{let delta=cents(v.initial)-cents(balance(a));if(!delta)return alert('Il saldo coincide già.'),false;put('transactions',{title:v.title,type:delta>0?'in':'out',amount:Math.abs(delta)/100,category:'Rettifica saldo',account:id,date:date(),adjustment:true,payment:'',tags:[]})})}
function repayCard(id){let a=data.accounts.find(x=>x.id===id),sources=activeAccounts().filter(x=>x.id!==id&&accountKind(x)!=='credit');if(!a||!sources.length)return alert('Serve un altro conto attivo per il rimborso.');openForm('Rimborso carta',money('amount',Math.max(0,-balance(a)).toFixed(2))+select('account','Conto di addebito',opts(sources))+field('date','Data effettiva','date',date())+`<p class="muted">Destinazione: ${esc(a.name)}. Il rimborso è un trasferimento e non una nuova spesa.</p>`,v=>{if(v.date>date())return alert('Inserisci la data del rimborso effettuato.'),false;put('transactions',{title:'Rimborso '+a.name,amount:Number(v.amount),type:'transfer',category:'Trasferimento',account:v.account,toAccount:id,date:v.date,payment:'Bonifico',tags:[]})})}
function installmentEntries(p){let n=p.count,c=cents(p.amount),base=Math.floor(c/n),extra=c%n,d=new Date(p.first+'T12:00'),paid=new Map(data.transactions.filter(t=>t.installmentId===p.id).map(t=>[t.installmentIndex,t]));return Array.from({length:n},(_,i)=>{let month=new Date(d.getFullYear(),d.getMonth()+i,1,12),day=Math.min(d.getDate(),new Date(month.getFullYear(),month.getMonth()+1,0).getDate());month.setDate(day);return {index:i,date:isoDay(month),amount:(base+(i<extra?1:0))/100,paid:paid.get(i)}})}
function installmentPanel(){let list=installmentList(),remaining=list.reduce((s,p)=>s+installmentEntries(p).filter(r=>!r.paid).reduce((a,r)=>a+cents(r.amount),0),0)/100;return `<section class="card"><div class="section-heading"><h3>Pagamenti rateali</h3>${btn('+ Nuovo piano','editInstallment()','primary')}</div><small>Debito residuo dei piani · non sottratto nuovamente dal patrimonio</small><div class="metric">${eur(remaining)}</div><p class="muted">Le rate sono contabilizzate solo dopo conferma. Non registrare anche l'intero acquisto come spesa: verrebbe contato due volte.</p>${list.map(p=>{let rows=installmentEntries(p),done=rows.filter(r=>r.paid).length,left=rows.filter(r=>!r.paid),next=left[0];return `<details class="installment-card"><summary><div class="account-head">${categoryValueBadge(p.category,'out','lg')}<div><b>${esc(p.title)}</b><small>${done}/${p.count} rate pagate · ${esc(accountName(p.account))}</small></div><b>${eur(left.reduce((s,r)=>s+cents(r.amount),0)/100)}</b></div><div class="bar"><span style="width:${done/p.count*100}%"></span></div><small>${next?'Prossima rata: '+esc(next.date)+' · '+eur(next.amount):'Piano completato'}</small></summary><div class="actions">${!done?btn('Modifica',`editInstallment('${p.id}')`)+btn('Elimina piano',`deleteInstallment('${p.id}')`):''}</div>${rows.map(r=>`<div class="line"><div><b>Rata ${r.index+1} / ${p.count}</b><br><small>${esc(r.date)} · ${r.paid?'Pagata il '+esc(r.paid.date):r.date<date()?'Scaduta':'Da pagare'}</small></div><div class="actions"><b>${eur(r.amount)}</b>${r.paid?'<span class="green">✓</span>':trashedInstallment(p.id,r.index)?btn('Nel cestino','openTrash()'):btn('Registra',`payInstallment('${p.id}',${r.index})`,'primary')}</div></div>`).join('')}</details>`}).join('')||empty('Nessun piano rateale.')}</section>`}
function trashedInstallment(id,index){return recordTrash().some(z=>z.transaction.installmentId===id&&(index===undefined||z.transaction.installmentIndex===index))}
function editInstallment(id){if(id&&trashedInstallment(id))return alert('Il piano ha rate nel cestino. Ripristinale o eliminale definitivamente prima di modificare il piano.');let p=installmentList().find(x=>x.id===id)||{};if(!activeAccounts().length)return alert('Crea prima un conto attivo.');if(id&&installmentEntries(p).some(r=>r.paid))return alert('Il piano ha già rate registrate.');openForm(id?'Modifica piano':'Nuovo piano rateale',field('title','Descrizione','text',p.title)+money('amount',p.amount).replace('Importo (€)','Importo totale (€)')+field('count','Numero di rate mensili','number',p.count||3,'min="2" max="120" step="1"')+field('first','Prima scadenza','date',p.first||date())+select('account','Conto di pagamento',opts(activeAccounts(),p.account))+select('category','Categoria',categoryOptions('out',p.category))+paymentField(p)+`<small>Le rate sono mensili; se il giorno non esiste, si usa l’ultimo del mese. Gli eventuali centesimi residui sono distribuiti sulle prime rate.</small>`,v=>{if(cents(v.amount)<Number(v.count))return alert('L’importo deve consentire almeno un centesimo per rata.'),false;data.installments=installmentList();put('installments',{title:v.title,amount:Number(v.amount),count:Number(v.count),first:v.first,account:v.account,category:v.category,payment:v.payment||'',type:'out'},id)},{type:'out',initial:p.category})}
function payInstallment(id,index){let p=installmentList().find(x=>x.id===id),r=p&&installmentEntries(p)[index];if(!r||r.paid)return;if(trashedInstallment(id,index))return alert('Questa rata è nel cestino. Ripristinala oppure eliminala definitivamente prima di registrarla di nuovo.');if(!activeAccounts().some(a=>a.id===p.account))return alert('Riattiva il conto prima di registrare la rata.');openForm('Registra rata',`<p><b>${esc(p.title)} · ${index+1}/${p.count}</b><br>${eur(r.amount)} · scadenza ${esc(r.date)}</p>`+field('date','Data del pagamento','date',date())+`<small>Verrà creato un solo movimento di uscita sul conto ${esc(accountName(p.account))}.</small>`,v=>{if(v.date>date())return alert('La data del pagamento non può essere futura.'),false;if(installmentEntries(p)[index].paid)return false;put('transactions',{title:p.title+' · rata '+(index+1)+'/'+p.count,amount:r.amount,type:'out',category:p.category,account:p.account,date:v.date,payment:p.payment||'',tags:[],installmentId:id,installmentIndex:index})})}
function deleteInstallment(id){if(trashedInstallment(id))return alert('Il piano ha rate nel cestino. Ripristinale o eliminale definitivamente prima di eliminare il piano.');let p=installmentList().find(x=>x.id===id);if(!p||installmentEntries(p).some(r=>r.paid))return;remove('installments',id)}
function installmentPlans(){return installmentList().flatMap(p=>installmentEntries(p).filter(r=>!r.paid).map(r=>({id:p.id,title:p.title+' · rata '+(r.index+1)+'/'+p.count,type:'out',category:p.category,account:p.account,amount:r.amount,when:r.date,installment:true}))) }
function budgets(){return monthControl()+`<section class="card"><h3>Budget · ${monthName()}</h3>${btn('+ Nuovo budget','editBudget()','primary')}${data.budgets.length?data.budgets.map(b=>{let used=total(monthly().flatMap(recordAllocations).filter(t=>t.type==='out'&&(t.category===b.category||t.category.startsWith(b.category+' / ')))),p=used/b.amount*100;return `<div class="line"><div style="flex:1;min-width:150px"><b>${esc(b.category)}</b><div class="bar"><span style="width:${Math.min(100,p)}%;background:${p>100?'#cb8291':'#79b8df'}"></span></div><small>${eur(used)} / ${eur(b.amount)} · ${p>100?'Superato':'Disponibile '+eur(b.amount-used)}</small></div><div class="actions">${btn('✎',`editBudget('${b.id}')`)}${btn('×',`remove('budgets','${b.id}')`)}</div></div>`}).join(''):empty('Imposta un limite mensile per categoria.')}</section>`}function editBudget(id){let b=data.budgets.find(x=>x.id===id)||{};openForm('Budget mensile',select('category','Categoria',categoryOptions('out',b.category))+money('amount',b.amount),v=>{if(data.budgets.some(x=>x.category===v.category&&x.id!==id)){alert('Esiste già un budget per questa categoria.');return false}put('budgets',{...v,amount:Number(v.amount)},id)},{type:'out',initial:b.category})}
function goalIcons(){return [['wallet','Portafoglio'],['gift','Regalo'],['plane','Viaggio'],['home','Casa'],['car','Auto'],['phone','Smartphone'],['game','Videogiochi'],['pokeball','Poké Ball'],['book','Libri'],['shield','Emergenze'],['heart','Cuore'],['gem','Sogno'],['graduation','Studio'],['paw','Animali'],['chart','Progetti']]}
function goalColor(g){return validHex(g.color)?g.color:currentAppearance().accent}
function goalGlyph(g){return goalIcons().some(x=>x[0]===g.glyph)?g.glyph:'wallet'}
function goalBadge(g){return `<span class="category-badge lg" style="--cat-color:${goalColor(g)}"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${categoryIconSvg[goalGlyph(g)]||categoryIconSvg.wallet}</svg></span>`}
function goalReserved(){return data.goals.reduce((n,g)=>n+cents(g.saved),0)/100}
function goalFunds(){return data.accounts.filter(a=>accountKind(a)!=='credit').reduce((n,a)=>n+cents(balance(a)),0)/100}
function goalRemaining(g){return Math.max(0,cents(g.amount)-cents(g.saved))/100}
function goalMonths(d,today=date()){if(!validDay(d)||d<=today)return 0;let a=new Date(today+'T12:00'),b=new Date(d+'T12:00'),m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();return Math.max(1,m+(b.getDate()>a.getDate()?1:0))}
function goalMonthly(g){let m=goalMonths(g.deadline);return m?Math.ceil(cents(goalRemaining(g))/m)/100:null}
function goalPercent(g){return quickPrefs().privacy?'•••':Math.min(100,Math.floor(100*cents(g.saved)/cents(g.amount)))+'%'}
function goalSummary(){let reserved=goalReserved(),free=(cents(goalFunds())-cents(reserved))/100;return `<div class="savings-summary"><div><small>Totale accantonato</small><div class="metric">${eur(reserved)}</div></div><div><small>Saldo dei conti senza credito, al netto dei salvadanai</small><div class="metric ${free<0?'red':''}">${eur(free)}</div></div></div><small>Accantonamenti virtuali: non modificano i conti, il patrimonio o le statistiche. Per considerare anche le scadenze, consulta Disponibilità e impegni nella Panoramica.</small>${free<0&&!quickPrefs().privacy?'<p class="notice">I risparmi accantonati superano il saldo dei conti senza credito.</p>':''}`}
function savingsPanel(){return `<section class="card"><div class="section-heading"><h3>Salvadanai</h3>${!quickPrefs().hidden.includes('goals')?'<button class="text-link" onclick="go(\'goals\')">Vedi tutti ›</button>':''}</div>${goalSummary()}${data.goals.slice(0,3).map(g=>`<div class="line"><span class="savings-name">${goalBadge(g)} ${esc(g.name)}</span><b>${eur(g.saved)}</b></div>`).join('')}</section>`}
function goals(){return `<section class="card"><div class="section-heading"><h3>I tuoi salvadanai</h3>${btn('+ Nuovo salvadanaio','editGoal()','primary')}</div>${goalSummary()}</section><div class="savings-grid">${data.goals.map(g=>{let remaining=goalRemaining(g),monthly=goalMonthly(g);return `<article class="card savings-tile"><div class="savings-head">${goalBadge(g)}<div><h3>${esc(g.name)}</h3><small>${g.deadline?'Obiettivo entro '+esc(g.deadline.split('-').reverse().join('/')):'Senza scadenza'}</small></div><span class="savings-percent">${goalPercent(g)}</span></div><div class="metric">${eur(g.saved)}</div><small>di ${eur(g.amount)} · ${remaining?('Mancano '+eur(remaining)):'Obiettivo raggiunto'}</small><div class="bar goal-progress"><span style="background:${goalColor(g)};width:${Math.min(100,100*cents(g.saved)/cents(g.amount))}%"></span></div>${remaining&&g.deadline?`<div class="savings-tip">${monthly!==null?`Da accantonare ogni mese: <b>${eur(monthly)}</b> <small>(stima su ${goalMonths(g.deadline)} mesi)</small>`:g.deadline===date()?'Scadenza oggi':'Scadenza superata'}</div>`:''}${g.note?`<p class="savings-note">${esc(g.note)}</p>`:''}<div class="actions savings-actions">${btn('+ Accantona',`addSaving('${g.id}')`,'primary')}${btn('− Preleva',`addSaving('${g.id}',true)`)}${btn('Storico',`goalHistory('${g.id}')`)}${btn('Modifica',`editGoal('${g.id}')`)}${btn('Elimina',`deleteGoal('${g.id}')`,'quiet-danger')}</div></article>`}).join('')}</div>${data.goals.length?'':`<section class="card">${empty('Qual è il tuo prossimo sogno? Crea il primo salvadanaio.')}</section>`}`}
function editGoal(id){let g=data.goals.find(x=>x.id===id)||{};openForm(id?'Modifica salvadanaio':'Nuovo salvadanaio',field('name','Nome','text',g.name)+money('amount',g.amount).replace('Importo (€)','Obiettivo (€)')+(!id?field('saved','Già accantonato (€)','number',0,'min="0" step="0.01"'):'')+`<label>Data obiettivo (facoltativa)<input type="date" name="deadline" value="${esc(g.deadline||'')}"></label><div class="two"><label>Colore<input type="color" name="color" value="${goalColor(g)}"></label>${select('glyph','Icona',opts(goalIcons().map(([id,name])=>({id,name})),goalGlyph(g)))}</div><label>Note (facoltative)<textarea name="note" maxlength="500" rows="3">${esc(g.note||'')}</textarea></label><small>Il denaro rimane nei tuoi conti. Gli accantonamenti non sono uscite.</small>`,v=>{if(v.deadline&&!validDay(v.deadline))return alert('Data obiettivo non valida.'),false;if(!validHex(v.color)||!goalIcons().some(x=>x[0]===v.glyph))return false;let record={name:v.name,amount:Number(v.amount),deadline:v.deadline,color:v.color,glyph:v.glyph,note:v.note.trim()};if(!id){record.saved=Number(v.saved);if(record.saved>0&&cents(goalReserved())+cents(record.saved)>cents(goalFunds())&&!confirm('Gli accantonamenti supereranno il saldo dei conti senza credito. Continuare?'))return false;record.opening=record.saved;record.history=[]}put('goals',record,id)})}
function addSaving(id,withdraw=false){let g=data.goals.find(x=>x.id===id);if(!g)return;if(withdraw&&cents(g.saved)===0)return alert('Non ci sono risparmi da prelevare.');openForm(withdraw?'Preleva dal salvadanaio':'Accantona nel salvadanaio',`<p>${esc(g.name)} · Accantonato: <b>${eur(g.saved)}</b></p>`+money()+`<label>Nota (facoltativa)<input name="note" maxlength="200" placeholder="Es. Risparmio del mese"></label><small>${withdraw?'Libera una parte del risparmio virtuale, senza registrare un’entrata.':'Riserva denaro già presente nei conti, senza registrare un’uscita.'}</small>`,v=>{let n=cents(v.amount),next=cents(g.saved)+(withdraw?-n:n);if(next<0||!Number.isSafeInteger(next))return alert('Importo superiore ai risparmi disponibili o non valido.'),false;if(!withdraw&&cents(goalReserved())+n>cents(goalFunds())&&!confirm('Gli accantonamenti supereranno il saldo dei conti senza credito. Continuare?'))return false;if(!Array.isArray(g.history)){g.opening=g.saved;g.history=[]}g.history.push({id:uid(),date:date(),kind:withdraw?'withdraw':'deposit',amount:n/100,note:v.note.trim()});g.saved=next/100})}

$('import').onchange=async e=>{let f=e.target.files[0],epoch=secEpoch;e.target.value='';if(!f||!secKey)return;try{if(f.size>SEC_MAX)throw Error('File troppo grande.');let x=JSON.parse(await f.text());if(epoch!==secEpoch||!secKey)return;if(x.format===SEC_FORMAT){secCheck(x,'backup');secPasswordDialog('Apri backup protetto',secField('old','Password del backup'),async v=>{let k=await secDerive(v.old,secCheck(x,'backup').salt),payload;try{payload=await secOpen(x,k,'backup')}catch(e){throw Error('Password errata oppure backup danneggiato.')}secImport(payload.archive)})}else secImport(x)}catch(err){alert('Importazione non riuscita: '+err.message)}};

// Smart Habits: all preferences and review markers belong to the encrypted archive.
function habitShift(day,n){let d=new Date(day+'T12:00');d.setDate(d.getDate()+n);return isoDay(d)}
function habitDayCount(a,b){return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000)}
function habitTime(s){return typeof s==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(s)}
function habitDefaults(){return {start:date(),checks:{},weekly:'',dailyTime:'20:30',weeklyTime:'20:00',weeklyDay:0,backupTime:'20:15',backupReminder:false,reminderId:uid()}}
function habitValidate(h){if(h===undefined)return;if(!h||typeof h!=='object'||Array.isArray(h)||!validDay(h.start)||!h.checks||typeof h.checks!=='object'||Array.isArray(h.checks)||!habitTime(h.dailyTime)||!habitTime(h.weeklyTime)||!habitTime(h.backupTime)||!Number.isInteger(h.weeklyDay)||h.weeklyDay<0||h.weeklyDay>6||typeof h.backupReminder!=='boolean'||typeof h.reminderId!=='string'||!/^[a-zA-Z0-9-]+$/.test(h.reminderId)||!(h.weekly===''||validDay(h.weekly))||Object.entries(h.checks).some(([d,v])=>!validDay(d)||d<h.start||!v||!['reviewed','empty'].includes(v.status)||typeof v.sig!=='string'||!/^\d+:\d+$/.test(v.sig)))throw Error('Controlli quotidiani non validi.')}
function habitGroups(){let m=new Map();for(let t of data.transactions){if(t.date>date())continue;let a=m.get(t.date)||[];a.push(t);m.set(t.date,a)}return m}
function habitSig(ts){let h=2166136261;let s=JSON.stringify(ts.slice().sort((a,b)=>a.id.localeCompare(b.id)).map(t=>[t.id,t.type,t.amount,t.account,t.toAccount,t.title,t.category,t.payment,t.splits,t.adjustment]));for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return ts.length+':'+(h>>>0)}
function habitStatus(d,m=habitGroups()){let h=data.habits;if(!h||d<h.start||d>date())return 'outside';let c=h.checks[d];if(!c)return 'pending';let ts=m.get(d)||[];return c.sig===habitSig(ts)&&!(c.status==='empty'&&ts.length)?c.status:'changed'}
function habitIsDone(s){return s==='reviewed'||s==='empty'}
function habitSummary(){let h=data.habits,m=habitGroups(),today=date();if(!h||h.start>today)return {pending:0,groups:m};let days=Math.max(0,habitDayCount(h.start,today)+1),checked=Object.keys(h.checks).filter(d=>d>=h.start&&d<=today&&habitIsDone(habitStatus(d,m))).length;return {pending:days-checked,groups:m}}
function habitCommit(change,message){let before=JSON.stringify(data);try{change();habitValidate(data.habits);if(!save()){data=JSON.parse(before);return false}render();notify(message);return true}catch(e){data=JSON.parse(before);alert(e.message);return false}}
function habitEnable(){if(data.habits)return;habitCommit(()=>{data.habits=habitDefaults()},'Controllo quotidiano attivato')}
function habitMark(d,status){let h=data.habits;if(!h||!validDay(d)||d<h.start||d>date()||!['reviewed','empty','clear'].includes(status))return false;let ts=data.transactions.filter(t=>t.date===d);if(status==='empty'&&ts.length){alert('Questa giornata contiene movimenti. Usa Giornata verificata.');return false}return habitCommit(()=>{if(status==='clear')delete h.checks[d];else h.checks[d]={status,sig:habitSig(ts)}},status==='clear'?'Verifica riaperta':'Giornata verificata')}
function habitLabel(d){return new Date(d+'T12:00').toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})}
function habitPanel(){let h=data.habits,today=date();if(!h)return `<section class="card habit-card" data-habit-day="${today}"><div class="section-heading"><h3>Controllo quotidiano</h3>${uiIcon('calendar')}</div><p>Dedica due minuti al giorno per verificare entrate e uscite. Inizia da oggi, senza giornate arretrate.</p><div class="actions">${btn('Attiva controllo','habitEnable()','primary')}${btn('Registrazione lampo',"habitQuick('out')")}</div></section>`;let {pending,groups}=habitSummary(),s=habitStatus(today,groups),weekDue=!h.weekly||habitDayCount(h.weekly,today)>=7||h.weekly>today;let days=Array.from({length:7},(_,i)=>habitShift(today,i-6));return `<section class="card habit-card" data-habit-day="${today}"><div class="section-heading"><h3>Controllo quotidiano</h3><span class="habit-pill ${pending?'pending':'done'}">${pending?pending+' da verificare':'Giornate verificate'}</span></div><p class="muted">${pending?'Completa le giornate non controllate.':'Hai confermato tutte le giornate dal '+habitLabel(h.start)+'.'} La verifica è manuale, non garantisce che non manchino spese.</p><div class="habit-days">${days.map(d=>{let x=habitStatus(d,groups);return `<button type="button" class="habit-day ${habitIsDone(x)?'done':x==='outside'?'outside':'pending'}" ${x==='outside'?'disabled':''} aria-label="${esc(habitLabel(d))} · ${habitIsDone(x)?'verificata':x==='outside'?'non attiva':'da verificare'}" onclick="habitReview('${d}')"><small>${esc(new Date(d+'T12:00').toLocaleDateString('it-IT',{weekday:'short'}))}</small><b>${habitIsDone(x)?'✓':Number(d.slice(-2))}</b></button>`}).join('')}</div><div class="actions">${!habitIsDone(s)?btn('Verifica oggi',`habitReview('${today}')`,'primary'):btn('Oggi verificato',`habitReview('${today}')`)}${today>h.start?btn('Giorni precedenti',`habitReview('${habitShift(today,-1)}')`):''}${btn('Registrazione lampo',"habitQuick('out')")}</div><div class="habit-week"><div><b>Controllo settimanale dei saldi</b><small>${weekDue?'Da effettuare': 'Ultimo controllo: '+esc(habitLabel(h.weekly))}</small></div>${btn('Controlla','habitWeekly()')}</div></section>`}
function habitReview(d=date()){let h=data.habits;if(!h)return habitEnable();if(!validDay(d)||d<h.start||d>date())return;let ts=data.transactions.filter(t=>t.date===d),s=habitStatus(d),m=habitGroups(),oldest=h.start;for(let checked of Object.keys(h.checks).sort()){if(checked<oldest)continue;if(checked!==oldest||!habitIsDone(habitStatus(checked,m)))break;if(oldest>=date())break;oldest=habitShift(oldest,1);}let content=`<label>Giornata<input id="habit-review-date" type="date" min="${h.start}" max="${date()}" value="${d}" onchange="if(validDay(this.value)&&this.value>=data.habits.start&&this.value<=date()){$('modal').close();habitReview(this.value)}"></label><div class="actions">${d>h.start?btn('‹ Precedente',`$('modal').close();habitReview('${habitShift(d,-1)}')`):''}${d<date()?btn('Successiva ›',`$('modal').close();habitReview('${habitShift(d,1)}')`):''}${oldest!==d?btn('Prima da verificare',`$('modal').close();habitReview('${oldest}')`):''}</div><p>${habitIsDone(s)?'Giornata già verificata.':s==='changed'?'I movimenti sono cambiati dopo la verifica: ricontrolla.':'Confronta i movimenti con le spese realmente effettuate.'}</p><div class="habit-review-list">${ts.length?ts.map(t=>`<div class="line"><div><b>${esc(t.title)}</b><br><small>${esc(accountName(t.account))}</small></div><b class="${t.type==='out'?'red':t.type==='in'?'green':''}">${t.type==='out'?'−':t.type==='in'?'+':'↔ '}${eur(t.amount)}</b></div>`).join(''):empty('Nessun movimento registrato.')}</div><div class="actions">${btn('+ Uscita lampo',`$('modal').close();habitQuick('out','${d}')`,'danger')}${btn('+ Entrata lampo',`$('modal').close();habitQuick('in','${d}')`)}${btn('Apri movimenti',`$('modal').close();habitOpenDay('${d}')`)}</div><div class="actions">${btn('Giornata verificata',`if(habitMark('${d}','reviewed'))$('modal').close()`,'primary')}${!ts.length?btn('Oggi nessun movimento'.replace('Oggi',d===date()?'Oggi':'Quel giorno'),`if(habitMark('${d}','empty'))$('modal').close()`):''}${habitIsDone(s)?btn('Riapri verifica',`if(habitMark('${d}','clear'))$('modal').close()`):''}</div>`;habitDialog('Verifica giornata',content)}
function habitDialog(title,content){let d=$('modal');d.innerHTML=`<div class="sheet-heading"><div><small>MoneyFlow</small><h3 id="editor-title">${title}</h3></div><button type="button" class="sheet-close" aria-label="Chiudi" onclick="$('modal').close()">${nativeIcon('close')}</button></div>${content}`;if(!d.open)d.showModal()}
function habitOpenDay(d){recordPage=0;bulkIds.clear();query='';filter='all';advanced={from:d,to:d};month=d.slice(0,7);go('transactions')}
function habitWeekly(){let h=data.habits;if(!h)return habitEnable();habitDialog('Controllo settimanale',`<p>Confronta ogni saldo con il conto, il portafoglio o l'estratto della carta. Cerca prima eventuali movimenti mancanti; usa la rettifica soltanto per differenze non ricostruibili.</p>${activeAccounts().map(a=>`<div class="line"><div><b>${esc(a.name)}</b><br><small>${eur(balance(a))}</small></div>${btn('Riconcilia',`$('modal').close();reconcileAccount('${a.id}')`)}</div>`).join('')}<p class="muted">Conferma soltanto dopo aver controllato tutti i conti. La conferma non modifica i saldi.</p>${btn('Saldi controllati',"if(habitCommit(()=>{data.habits.weekly=date()},'Controllo settimanale registrato'))$('modal').close()",'primary')}`)}
function habitCategories(type){let all=tree().filter(c=>c.type===type).flatMap(c=>[c.name,...c.subs.map(s=>c.name+' / '+s.name)]),valid=new Set(all),counts=new Map(),today=date(),cutoff=habitShift(today,-90);for(let t of data.transactions){if(t.type!==type||t.adjustment||t.date>today||t.date<cutoff)continue;for(let c of recordCategories(t))if(valid.has(c))counts.set(c,(counts.get(c)||0)+1)}let ranked=[...counts].sort((a,b)=>b[1]-a[1]).map(x=>x[0]);let fallback=type==='out'?['Alimentari / Bar e caffetteria','Alimentari / Supermercato','Auto / Carburante','Shopping','Alimentari / Fast food','Manga e fumetti']:['Stipendio','Regali','Rimborsi','Extra'];return [...new Set([...ranked,...fallback,...all])].filter(c=>valid.has(c)).slice(0,6)}
function habitQuick(type='out',day=date()){if(!['in','out'].includes(type)||!validDay(day)||day>date())return;let accounts=activeAccounts();if(!accounts.length)return alert('Crea prima un conto attivo.');let recent=lastAccount(type)||accounts[0].id,prev=data.transactions.slice().reverse().find(t=>t.type===type&&t.account===recent&&!t.adjustment&&paymentOptions.includes(t.payment)),choices=habitCategories(type);openForm(type==='out'?'Uscita lampo':'Entrata lampo',`<input type="hidden" name="type" value="${type}">${money('amount')}<p class="muted">Scegli una categoria frequente oppure cercala nell’elenco.</p><div class="habit-tiles">${choices.map((c,i)=>`<button type="button" data-habit-choice="${i}" aria-pressed="false">${categoryValueBadge(c,type,'lg')}<span>${esc(c.split(' / ').pop())}</span></button>`).join('')}</div>${select('category','Categoria','<option value="" selected disabled>Scegli categoria</option>'+categoryOptions(type,''))}${select('account','Conto',opts(accounts,recent))}${field('date','Data','date',day,`max="${date()}"`)}<details class="advanced"><summary>Descrizione e pagamento (facoltativi)</summary><label>Descrizione<input name="description" placeholder="Nome della categoria"></label>${paymentField(prev||{})}</details>`,v=>{if(!v.category||!tree().some(c=>c.type===type&&(c.name===v.category||c.subs.some(s=>c.name+' / '+s.name===v.category)))||!activeAccounts().some(a=>a.id===v.account)||v.date>date()||!exactMoney(Number(v.amount)))return alert('Controlla importo, categoria, conto e data.'),false;put('transactions',{type,amount:Number(v.amount),title:v.description.trim()||v.category.split(' / ').pop(),category:v.category,account:v.account,date:v.date,payment:v.payment||'',tags:[]})});let f=$('editor'),cat=f.elements.category;function sync(){f.querySelectorAll('[data-habit-choice]').forEach((b,i)=>b.setAttribute('aria-pressed',String(choices[i]===cat.value)))}f.querySelectorAll('[data-habit-choice]').forEach((b,i)=>b.onclick=()=>{cat.value=choices[i];sync()});cat.addEventListener('change',sync);f.querySelector('[type=submit]').textContent='Registra '+(type==='out'?'uscita':'entrata');f.elements.amount.focus()}
function habitSettings(){let h=data.habits;if(!h)return `<section class="card settings-group"><h3>Abitudini e promemoria</h3><p>Attiva il controllo quotidiano per iniziare da oggi e configurare gli avvisi del calendario.</p>${btn('Attiva controllo','habitEnable()','primary')}</section>`;return `<section class="card settings-group"><h3>Abitudini e promemoria</h3><p>Imposta l'orario e scarica un calendario ricorrente. Importalo in un calendario del dispositivo (preferibilmente locale) e verifica che gli avvisi siano abilitati. MoneyFlow non invia notifiche da chiuso.</p><div class="two"><label>Controllo quotidiano<input type="time" value="${h.dailyTime}" onchange="habitSet('dailyTime',this.value)"></label><label>Controllo settimanale<select onchange="habitSet('weeklyDay',Number(this.value))">${['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'].map((s,i)=>`<option value="${i}" ${h.weeklyDay===i?'selected':''}>${s}</option>`).join('')}</select></label><label>Orario settimanale<input type="time" value="${h.weeklyTime}" onchange="habitSet('weeklyTime',this.value)"></label><label>Orario backup (settimanale)<input type="time" value="${h.backupTime}" onchange="habitSet('backupTime',this.value)"></label></div><label class="quick-setting"><input type="checkbox" ${h.backupReminder?'checked':''} onchange="habitSet('backupReminder',this.checked)"> Includi promemoria backup protetto</label><div class="actions">${btn('Scarica promemoria .ics','habitExport()','primary')}${btn('Verifica giornate',"habitReview()")}</div><p class="muted">Il file contiene solo promemoria generici, non dati finanziari. Se cambi orari, elimina gli eventi vecchi prima di importare quelli nuovi. Se preferisci, crea due promemoria ricorrenti manualmente nell'app Promemoria del telefono.</p></section>`}
function habitSet(k,v){if(!data.habits||!['dailyTime','weeklyDay','weeklyTime','backupTime','backupReminder'].includes(k))return;habitCommit(()=>{data.habits[k]=v},'Preferenza aggiornata')}
function habitICS(h,now=new Date()){let today=isoDay(now),stamp=now.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MoneyFlow//Smart Habits//IT','CALSCALE:GREGORIAN','METHOD:PUBLISH'];function event(kind,title,time,weekly){let day=today;if(weekly){day=habitShift(day,(h.weeklyDay-now.getDay()+7)%7)}if(new Date(day+'T'+time+':00')<=now)day=habitShift(day,weekly?7:1);let start=day.replace(/-/g,'')+'T'+time.replace(':','')+'00';lines.push('BEGIN:VEVENT','UID:'+h.reminderId+'-'+kind+'@moneyflow.local','DTSTAMP:'+stamp,'DTSTART:'+start,'DURATION:PT5M','RRULE:FREQ='+(weekly?'WEEKLY;BYDAY='+['SU','MO','TU','WE','TH','FR','SA'][h.weeklyDay]:'DAILY'),'SUMMARY:'+title,'TRANSP:TRANSPARENT','BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:PT0M','DESCRIPTION:'+title,'END:VALARM','END:VEVENT')}event('daily','MoneyFlow - registra i movimenti',h.dailyTime,false);event('weekly','MoneyFlow - controlla i saldi',h.weeklyTime,true);if(h.backupReminder)event('backup','MoneyFlow - esporta un backup protetto',h.backupTime,true);lines.push('END:VCALENDAR');return lines.join('\r\n')+'\r\n'}
function habitExport(){if(!data.habits)return;download('MoneyFlow-promemoria.ics',habitICS(data.habits),'text/calendar;charset=utf-8');notify('Calendario scaricato: importalo e verifica gli avvisi')}

function pwaPanel(){return `<section class="card settings-group"><h3>App su iPhone e utilizzo offline</h3><p id="mf-pwa-status" role="status">${esc(window.mfPwaStatus||'Controllo disponibilità offline…')}</p><p>In Safari: Condividi → Aggiungi alla schermata Home → Apri come app web (se presente). Apri MoneyFlow dalla nuova icona mentre sei online, poi verifica l’avvio in modalità aereo.</p><p class="muted">I dati rimangono cifrati nella memoria locale di questa installazione. Prima di passare da Safari all’app Home esporta un backup protetto; importa il backup nella nuova app se necessario. Le notifiche a programma chiuso restano affidate a Promemoria o Calendario.</p></section>`}
